name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun typecheck
      - run: bun run build
      - run: bun run extensions:npm-smoke

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEEK_PORT: "3100"
      COMPOSE_PROJECT_NAME: peek-ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: docker compose config --quiet
      - run: bun run extensions:images
      - run: docker compose up --build --wait --wait-timeout 180
      - run: bun scripts/compose-smoke.ts create
      - run: docker compose down
      - run: docker compose run --rm --no-deps -T migrate tar -C /data -czf - . > /tmp/peek-backup.tar.gz
      - run: docker compose up --wait --wait-timeout 180
      - run: bun scripts/compose-smoke.ts verify
      - run: docker compose down
      - run: docker compose -p peek-ci-restored run --rm --no-deps -T migrate tar -C /data -xzf - < /tmp/peek-backup.tar.gz
      - run: docker compose -p peek-ci-restored up --build --wait --wait-timeout 180
      - run: bun scripts/compose-smoke.ts verify
      - if: failure()
        run: |
          docker compose logs --no-color
          docker compose -p peek-ci-restored logs --no-color
      - if: always()
        run: |
          docker compose down --volumes
          docker compose -p peek-ci-restored down --volumes

  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun run official:build
      - run: bun run extensions:images
      - run: PEEK_TEST_DOCKER=1 bun test tests/extensions-docker.test.ts
      - run: PEEK_PORT=3114 docker compose -p peek-extensions-ci up --build --wait --wait-timeout 180
      - run: bun scripts/extensions-smoke.ts
      - run: PEEK_PORT=3114 docker compose -p peek-extensions-ci restart
      - run: PEEK_PORT=3114 docker compose -p peek-extensions-ci up --wait --wait-timeout 180
      - run: bun scripts/extensions-smoke.ts verify
      - if: failure()
        run: docker compose -p peek-extensions-ci logs --no-color
      - if: always()
        run: docker compose -p peek-extensions-ci down --volumes
