name: peek
x-runtime: &runtime
  image: peek:local
  build:
    context: .
    target: runtime
  environment:
    PEEK_DATABASE_PATH: /data/peek.sqlite
    PEEK_TIMEZONE: ${PEEK_TIMEZONE:-}
    TZ: ${TZ:-UTC}
    PEEK_ALLOWED_HOSTS: ${PEEK_ALLOWED_HOSTS:-}
  volumes:
    - peek-data:/data
  init: true
  stop_grace_period: 45s

services:
  migrate:
    <<: *runtime
    command: ["bun", "run", "db:migrate"]
    restart: "no"
  worker:
    <<: *runtime
    command: ["bun", "run", "worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "scripts/healthcheck.ts", "worker"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
  web:
    <<: *runtime
    restart: unless-stopped
    ports:
      - "${PEEK_BIND_ADDRESS:-0.0.0.0}:${PEEK_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "scripts/healthcheck.ts", "web"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  extension-runner:
    profiles: [extensions]
    build:
      context: .
      target: extension-runner
    environment:
      PEEK_DATABASE_PATH: /data/peek.sqlite
      PEEK_RUNNER_NAMESPACE: ${COMPOSE_PROJECT_NAME:-peek}
    volumes:
      - peek-data:/data
      - ${PEEK_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  peek-data:
